<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#efe9dc">
  <meta name="description" content="Bharat Darshan: an interactive 3D map of India's geography and culture, in English and Hindi. भारत दर्शन: भारत का इंटरैक्टिव त्रिआयामी मानचित्र।">
  <title>Bharat Darshan · भारत दर्शन</title>
</head>
<body>
  <div id="app">
    <canvas class="map" aria-hidden="true"></canvas>

    <header class="topbar">
      <div class="wordmark">
        <span class="title" data-i18n="app.title">Bharat Darshan</span>
        <span class="title-other" data-i18n="app.title.other">भारत दर्शन</span>
      </div>
      <button class="lang-toggle" type="button" lang="hi" data-i18n="lang.switch" data-i18n-aria-label="lang.switch.aria">हिन्दी</button>
    </header>

    <div class="controls">
      <div class="relief" hidden>
        <label for="relief-slider" data-i18n="relief.label">Relief</label>
        <input id="relief-slider" class="relief-slider" type="range" min="0" max="30" step="1" value="12" data-i18n-aria-label="relief.aria">
        <span class="relief-value" aria-live="off">12×</span>
      </div>
      <div class="chips" role="group">
        <button class="chip chip-relief" type="button" aria-pressed="true" data-i18n="chip.relief">Relief</button>
      </div>
    </div>

    <section class="sheet" data-snap="peek" aria-label="Details">
      <div class="sheet-grip" role="button" tabindex="0" data-i18n-aria-label="sheet.grip"></div>
      <div class="sheet-head">
        <h1 class="sheet-title" data-i18n="sheet.title">India</h1>
        <p class="sheet-subtitle"></p>
      </div>
      <div class="sheet-body">
        <h2 data-i18n="sheet.about.heading">About this map</h2>
        <p data-i18n="sheet.about.body"></p>
        <p data-i18n="sheet.next"></p>
        <h2 data-i18n="sheet.credits.heading">Data and credits</h2>
        <ul>
          <li data-i18n="sheet.credits.boundaries"></li>
          <li data-i18n="sheet.credits.terrain"></li>
          <li data-i18n="sheet.credits.code"></li>
        </ul>
      </div>
    </section>

    <div class="status" role="status">
      <span class="status-text" data-i18n="status.loading">Loading the map…</span>
      <button class="status-retry" type="button" hidden data-i18n="status.retry">Try again</button>
    </div>

    <div class="fallback" hidden>
      <p data-i18n="fallback.webgl"></p>
    </div>
  </div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
