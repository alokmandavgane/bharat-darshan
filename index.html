<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#efe9dc">
  <meta name="description" content="An interactive 3D map of India's geography and culture, in English and Hindi.">
  <title>Bharat Darshan · भारत दर्शन</title>
  <link rel="canonical" href="https://darshan.alokm.com/en/">
  <link rel="alternate" hreflang="en" href="https://darshan.alokm.com/en/">
  <link rel="alternate" hreflang="hi" href="https://darshan.alokm.com/hi/">
  <link rel="alternate" hreflang="x-default" href="https://darshan.alokm.com/">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Bharat Darshan">
  <meta property="og:title" content="Bharat Darshan · भारत दर्शन">
  <meta property="og:description" content="An interactive 3D map of India's geography and culture, in English and Hindi.">
  <meta property="og:url" content="https://darshan.alokm.com/en/">
  <meta property="og:image" content="https://darshan.alokm.com/share/og-en.jpg">
  <meta property="og:image:width" content="2400">
  <meta property="og:image:height" content="1260">
  <meta property="og:image:alt" content="A clay model of India with its states, on paper, titled Bharat Darshan">
  <meta property="og:locale" content="en_IN">
  <meta property="og:locale:alternate" content="hi_IN">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Bharat Darshan · भारत दर्शन">
  <meta name="twitter:description" content="An interactive 3D map of India's geography and culture, in English and Hindi.">
  <meta name="twitter:image" content="https://darshan.alokm.com/share/og-en.jpg">
</head>
<body>
  <div id="app">
    <canvas class="map" aria-hidden="true"></canvas>
    <div class="labels" aria-hidden="true"></div>
    <div class="markers"></div>

    <header class="topbar">
      <!-- The wordmark, set into the paper rather than on a card (PLAN.md D14); the
           language toggle beside it. In poster mode it grows into the share card. -->
      <div class="wordmark">
        <!-- The atlas's name above a page's own title, on that page's share card only. -->
        <span class="kicker" hidden></span>
        <span class="title" data-i18n="app.title">Bharat Darshan</span>
        <span class="title-other" data-i18n="app.title.other">भारत दर्शन</span>
        <span class="tagline" data-i18n="app.tagline">A 3D map of India</span>
        <span class="site">darshan.alokm.com</span>
        <button class="lang-toggle" type="button" data-i18n="lang.switch" data-i18n-aria-label="lang.switch.aria">हिन्दी</button>
      </div>
    </header>

    <!-- The one control on the map: the compass, which is also the way home. -->
    <button class="reset-button paper" type="button" data-i18n-aria-label="view.reset" data-i18n-title="view.reset">
      <svg class="compass" viewBox="0 0 24 24" aria-hidden="true">
        <circle cx="12" cy="12" r="9.5" fill="none" stroke="currentColor" stroke-opacity="0.35" stroke-width="1.5"/>
        <path class="needle-n" d="M12 3.2 15 12H9z"/>
        <path class="needle-s" d="M12 20.8 9 12h6z"/>
      </svg>
    </button>

    <!-- The sheet: the one card, holding one stack -- contents, page, state, item, and
         the catalogue of layers on top of any of them (PLAN.md D14). The head names the
         level; the strip under it is the key: one mark per layer drawn, and the scale
         bar; a tapped mark unfolds its legend right there. -->
    <section class="sheet paper" data-snap="peek" aria-label="Details">
      <div class="sheet-grip" role="button" tabindex="0" data-i18n-aria-label="sheet.grip"></div>
      <div class="sheet-head">
        <div class="sheet-headline">
          <div class="sheet-titles">
            <p class="sheet-crumb" hidden></p>
            <h1 class="sheet-title" aria-live="polite">India</h1>
            <p class="sheet-meta">
              <span class="sheet-alt" hidden></span>
              <span class="sheet-subtitle"></span>
              <span class="sheet-draft" hidden data-i18n="facts.draft.short" data-i18n-title="facts.draft.long"></span>
            </p>
            <!-- What a drag up reveals, said in words: at peek the head is all a phone
                 shows, and nothing else says the atlas has pages. A tap on the head opens it. -->
            <p class="sheet-hint" hidden></p>
          </div>
          <button class="sheet-close" type="button" hidden data-i18n-aria-label="sheet.close">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14.5 5.5 8 12l6.5 6.5" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
        </div>
        <div class="strip" hidden>
          <div class="strip-marks" role="group" data-i18n-aria-label="legend.heading"></div>
          <button class="strip-add" type="button" data-i18n="strip.add" data-i18n-aria-label="strip.add.aria">+ layer</button>
          <!-- How big the model is, in kilometres. Exact along the screen's horizontal at any
               yaw or tilt, because the camera is orthographic (src/ui/scale.js). -->
          <div class="scale" aria-hidden="true" hidden>
            <span class="scale-label"></span>
            <div class="scale-bar"></div>
          </div>
        </div>
        <div class="strip-legend" hidden></div>
      </div>
      <div class="sheet-body">
        <nav class="card-steps" hidden data-i18n-aria-label="card.steps">
          <button class="card-prev" type="button" data-i18n-aria-label="card.prev">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
          <span class="card-count" aria-live="polite"></span>
          <button class="card-next" type="button" data-i18n-aria-label="card.next">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
          <button class="card-tour" type="button" aria-pressed="false" data-i18n-aria-label="tour.play" data-i18n-title="tour.play">
            <svg class="icon-play" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5.5v13l10-6.5z"/></svg>
            <svg class="icon-pause" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 5.5h3.5v13H7zM13.5 5.5H17v13h-3.5z"/></svg>
          </button>
        </nav>
        <div class="facts" hidden></div>
        <!-- Finding things: a field, and what it finds. Reachable from every view but a
             card, so every unit and every item on show is a few letters away. -->
        <div class="finder">
          <div class="search-wrap">
            <svg class="search-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="M16 16l4.5 4.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
            <input class="search" type="search" autocomplete="off" data-i18n-placeholder="list.search" data-i18n-aria-label="list.search">
          </div>
          <ul class="unit-list" hidden></ul>
        </div>
        <!-- The atlas's pages when none is open; the open page's own words and its layers
             when one is (PLAN.md D11). -->
        <div class="contents" hidden></div>
        <!-- The catalogue: every layer as a row, the base (relief, surroundings, graticule)
             first, behind "+ layer" on the strip. A level of the sheet, not a menu. -->
        <div class="catalogue" hidden>
          <div class="search-wrap">
            <svg class="search-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="M16 16l4.5 4.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
            <input class="catalogue-search" type="search" autocomplete="off" data-i18n-placeholder="menu.find" data-i18n-aria-label="menu.find">
          </div>
          <p class="catalogue-none" hidden data-i18n="list.none">Nothing found</p>
          <div class="layer-list" role="group"></div>
        </div>
        <!-- Every unit, behind a fold: reachable without hitting it, without being the
             first thing on every page. -->
        <details class="units" hidden>
          <summary class="units-summary"><span data-i18n="sheet.units">All states and union territories</span><span class="units-count"></span></summary>
          <ul class="unit-grid"></ul>
        </details>
        <!-- The foot of the contents: the tour, and about this map with its credits. -->
        <div class="foot" hidden>
          <button class="tour-row" type="button" hidden aria-pressed="false">
            <svg class="icon-play" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5.5v13l10-6.5z"/></svg>
            <span data-i18n="tour.play">Play a tour of the places</span>
          </button>
          <details class="about" id="about">
            <summary class="about-summary" data-i18n="sheet.about.summary">About this map, and credits</summary>
            <p data-i18n="sheet.about.body"></p>
            <p data-i18n="sheet.next"></p>
            <h2 data-i18n="sheet.credits.heading">Data and credits</h2>
            <!-- Generated from content/sources.json by the shell, so it credits exactly what
                 the atlas cites and nothing it does not (PLAN.md section 5). -->
            <ul class="credits" hidden></ul>
          </details>
        </div>
      </div>
    </section>

    <div class="tooltip paper" role="tooltip" hidden></div>

    <div class="status paper" role="status">
      <span class="status-text" data-i18n="status.loading">Loading the map…</span>
      <button class="status-retry" type="button" hidden data-i18n="status.retry">Try again</button>
    </div>

    <div class="fallback" hidden>
      <p data-i18n="fallback.webgl"></p>
    </div>
  </div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
